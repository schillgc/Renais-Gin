{% extends 'base.html' %}
{% load static %}

{% block content %}
<h2>Register a New Bottle</h2>
<p>Scan the QR code on your bottle to register it to your account.</p>

<div class="row">
    <div class="col-md-6">
        <div id="qr-scanner">
            <video id="qr-video" width="100%" height="300"></video>
            <button id="start-scanner" class="btn btn-primary mt-2">Start Scanner</button>
            <button id="stop-scanner" class="btn btn-secondary mt-2" style="display:none;">Stop Scanner</button>
        </div>
        <div id="qr-result" class="mt-3" style="display:none;">
            <p>Bottle ID: <span id="bottle-id"></span></p>
            <button id="register-bottle" class="btn btn-success">Register This Bottle</button>
        </div>
    </div>
    <div class="col-md-6">
        <p>Alternatively, you can enter the bottle ID manually:</p>
        <form method="post" id="manual-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="bottle_id">Bottle ID</label>
                <input type="text" name="bottle_id" class="form-control" id="bottle_id" required>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Register Manually</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/qr_scanner.js' %}"></script>
<script>
    // The QR scanning logic will be in qr_scanner.js
</script>
{% endblock %}
