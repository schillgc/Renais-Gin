version: '3.8'
services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=renais_gin
      - POSTGRES_USER=renais_user
      - POSTGRES_PASSWORD=secure_password
  redis:
    image: redis:7-alpine
  web:
    build: .
    command: gunicorn renais_gin.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./renais_gin:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "80:80"
    depends_on:
      - web
volumes:
  postgres_data:
  static_volume:
  media_volume: