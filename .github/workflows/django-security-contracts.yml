name: Django settings security contracts

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  settings-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run isolated settings contract tests
        run: |
          python -m unittest discover -s renais_gin -p "test_settings_security.py" -v
          python -m unittest discover -s renais_gin -p "test_api_security_contracts.py" -v
